[project]
name = "visual-learning-backend"
version = "0.1.0"
description = "API for the visual skills learning platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "minio>=7.2,<8",
    "pydantic-settings>=2.10,<3",
    "pyjwt>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "redis>=6.2,<7",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "structlog>=25.4,<26",
    "tzdata>=2025.2,<2027",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.16,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/presentation/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
